<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- %…% の部分は、ビルドのときに shared/appInfo.ts の値に置きかわる（pwa/vitePlugin.ts） -->
    <meta name="theme-color" content="%PAPER_LIGHT%" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>%APP_NAME%</title>
    <script>
      // 保存されている配色（昼・夜）を、最初に画面が描かれる前に反映する。
      // 決め方は src/features/settings/theme.ts の resolveTheme と同じにしておく。
      try {
        var theme = JSON.parse(localStorage.getItem('%STORAGE_PREFIX%:display.v1') || '{}').theme;
        var dark =
          theme === 'dark' ||
          (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '%PAPER_DARK%';
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
