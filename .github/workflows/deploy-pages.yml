# 画面を GitHub Pages に公開する。
# 公開版は画面だけで、パウロ先生の API サーバーは無い。先生は、読者が設定で入れた自分の API キーで動く。
name: GitHub Pages に公開

on:
  push:
    branches: [claude/dreamy-galileo-ub9cu6, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、新しい方だけを残す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_TEACHER_SERVER: 'false'
      # Pages は、リポジトリの Settings → Pages で「GitHub Actions」を選んで有効にしておく
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
